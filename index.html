<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KymCar — автомобили с пробегом</title><style>
:root{--bg:#060910;--panel:#0d1320;--line:#1c2b40;--text:#eef5ff;--muted:#8494aa;--blue:#39a8ff;--blue2:#176bff;--green:#36e0a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#10234b 0,transparent 35%),var(--bg);color:var(--text);font:15px Inter,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.nav{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;background:#060910eF;backdrop-filter:blur(14px);z-index:5}.logo{font-size:25px;font-weight:900;letter-spacing:-1px}.logo i{color:var(--blue);font-style:normal}.navlinks{display:flex;gap:18px;align-items:center}.nav button,.ghost{background:transparent;color:var(--text);border:1px solid var(--line);padding:9px 13px;border-radius:10px}.primary{background:linear-gradient(135deg,var(--blue2),var(--blue));border:0;color:white;padding:11px 16px;border-radius:11px;font-weight:800}.hero{min-height:430px;padding:70px 5% 40px;display:grid;grid-template-columns:1fr 1fr;gap:35px;align-items:center}.eyebrow{color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:2px}.hero h1{font-size:clamp(42px,6vw,78px);line-height:.95;margin:15px 0}.hero p{color:var(--muted);font-size:18px;max-width:580px}.heroimg{height:330px;border-radius:26px;background:url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1400&q=85') center/cover;box-shadow:0 0 70px #176bff25}.search{margin:-10px 5% 45px;padding:18px;background:#0b1220;border:1px solid var(--line);border-radius:18px;display:grid;grid-template-columns:repeat(5,1fr) auto;gap:10px}.field{background:#070c15;border:1px solid var(--line);border-radius:10px;color:white;padding:12px;min-width:0}.section{padding:10px 5% 60px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.section h2{font-size:28px;margin:0}.sort{background:#0b1220;color:white;border:1px solid var(--line);padding:10px;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:linear-gradient(180deg,#0e1725,#0a101b);border:1px solid var(--line);border-radius:17px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-3px);border-color:#2c78c7}.pic{height:190px;background:#101927 center/cover no-repeat}.body{padding:15px}.title{font-weight:800;font-size:18px}.meta{color:var(--muted);font-size:13px;margin:7px 0}.price{font-size:21px;font-weight:900}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}.empty{text-align:center;padding:40px;color:var(--muted)}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.on{display:flex}.box{width:min(680px,100%);max-height:90vh;overflow:auto;background:#0b1220;border:1px solid var(--line);border-radius:18px;padding:22px}.form{display:grid;gap:10px}.form input,.form select,.form textarea{width:100%;background:#070c15;color:white;border:1px solid var(--line);border-radius:10px;padding:12px}.form textarea{min-height:100px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.close{float:right;background:none;border:0;color:var(--muted);font-size:25px}.toast{position:fixed;right:18px;bottom:18px;background:#101a2a;border:1px solid var(--line);padding:13px 16px;border-radius:12px;display:none;z-index:20}.toast.on{display:block}.muted{color:var(--muted)}@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.search{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.navlinks{gap:5px}.navlinks .ghost{display:none}.hero{padding-top:45px}.heroimg{height:220px}.search{grid-template-columns:1fr;margin-top:0}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.sectionhead{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head><body><nav class="nav"><div class="logo">Kym<i>Car</i></div><div class="navlinks"><button class="ghost" onclick="openAuth()">Войти</button><button class="primary" onclick="openSell()">Продать авто</button></div></nav><main><section class="hero"><div><div class="eyebrow">Новый взгляд на вторичный рынок</div><h1>Найди машину.<br>Не головную боль.</h1><p>Технологичная площадка для покупки и продажи автомобилей с пробегом.</p><button class="primary" onclick="document.querySelector('#catalog').scrollIntoView({behavior:'smooth'})">Смотреть автомобили</button></div><div class="heroimg"></div></section><section class="search"><select id="make" class="field"><option value="">Все марки</option></select><select id="model" class="field"><option value="">Все модели</option></select><input id="yearFrom" class="field" placeholder="Год от" type="number"><input id="yearTo" class="field" placeholder="Год до" type="number"><input id="priceTo" class="field" placeholder="Цена до" type="number"><button class="primary" onclick="loadCars()">Найти</button></section><section id="catalog" class="section"><div class="sectionhead"><h2>Автомобили</h2><select id="sort" class="sort" onchange="loadCars()"><option value="new">Сначала новые</option><option value="price_asc">Цена ↑</option><option value="price_desc">Цена ↓</option><option value="year_desc">Год ↓</option><option value="mileage_asc">Пробег ↑</option></select></div><div id="grid" class="grid"></div></section></main><div id="modal" class="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div><div id="toast" class="toast"></div><script>
const $=s=>document.querySelector(s);let cars=[];let me=null;const makes=['Mercedes-Benz','BMW','Audi','Toyota','Volkswagen','Kia','Hyundai','Lexus','Volvo','Ford'];
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ошибка');return d}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('on');setTimeout(()=>$('#toast').classList.remove('on'),2200)}
function openModal(html){$('#modalContent').innerHTML=html;$('#modal').classList.add('on')}function closeModal(){$('#modal').classList.remove('on')}
function card(c){return `<article class="card"><div class="pic" style="background-image:url('${c.image_url||'https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?auto=format&fit=crop&w=1000&q=80'}')"></div><div class="body"><div class="title">${c.make} ${c.model}</div><div class="meta">${c.year} · ${Number(c.mileage||0).toLocaleString('ru-RU')} км · ${c.city||'—'}</div><div class="price">${Number(c.price).toLocaleString('ru-RU')} ₽</div><div class="actions"><button class="ghost" onclick="viewCar(${c.id})">Подробнее</button><button class="primary" onclick="fav(${c.id})">♥</button></div></div></article>`}
async function loadCars(){const q=new URLSearchParams();['make','model','yearFrom','yearTo','priceTo','sort'].forEach(id=>{const v=$('#'+id).value;if(v)q.set(id,v)});try{cars=await api('/api/cars?'+q);$('#grid').innerHTML=cars.length?cars.map(card).join(''):'<div class="empty">Ничего не найдено</div>'}catch(e){toast(e.message)}}
async function viewCar(id){try{const c=await api('/api/cars/'+id);openModal(`<h2>${c.make} ${c.model}</h2><p class="muted">${c.year} · ${Number(c.mileage||0).toLocaleString('ru-RU')} км · ${c.fuel} · ${c.transmission}</p><h2>${Number(c.price).toLocaleString('ru-RU')} ₽</h2><p>${c.description||'Без описания'}</p><p>📍 ${c.city||'—'}</p><button class="primary" onclick="fav(${c.id})">Добавить в избранное</button>${c.seller_name?`<p class="muted">Продавец: ${c.seller_name}</p>`:''}`)}catch(e){toast(e.message)}}
async function fav(id){try{if(!me){openAuth();return}await api('/api/favorites/'+id,{method:'POST'});toast('Добавлено в избранное')}catch(e){toast(e.message)}}
function openAuth(){openModal(`<h2>Вход</h2><form class="form" onsubmit="login(event)"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Пароль" required><button class="primary">Войти</button></form><hr><h3>Нет аккаунта?</h3><form class="form" onsubmit="register(event)"><input id="rname" placeholder="Имя" required><input id="remail" type="email" placeholder="Email" required><input id="rpass" type="password" placeholder="Пароль от 6 символов" minlength="6" required><button class="ghost">Зарегистрироваться</button></form>`)}
async function login(e){e.preventDefault();try{me=(await api('/api/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})})).user;closeModal();toast('Добро пожаловать, '+me.name)}catch(x){toast(x.message)}}
async function register(e){e.preventDefault();try{me=(await api('/api/register',{method:'POST',body:JSON.stringify({name:$('#rname').value,email:$('#remail').value,password:$('#rpass').value})})).user;closeModal();toast('Аккаунт создан')}catch(x){toast(x.message)}}
function openSell(){if(!me){openAuth();toast('Сначала войдите');return}openModal(`<h2>Новое объявление</h2><form class="form" onsubmit="sell(event)"><div class="row"><input id="sMake" placeholder="Марка" required><input id="sModel" placeholder="Модель" required></div><div class="row"><input id="sYear" type="number" placeholder="Год" required><input id="sPrice" type="number" placeholder="Цена, ₽" required></div><div class="row"><input id="sMileage" type="number" placeholder="Пробег, км"><input id="sCity" placeholder="Город"></div><div class="row"><select id="sFuel"><option>Бензин</option><option>Дизель</option><option>Гибрид</option><option>Электро</option></select><select id="sTrans"><option>Автомат</option><option>Механика</option></select></div><input id="sImage" placeholder="Ссылка на фото"><textarea id="sDesc" placeholder="Описание"></textarea><button class="primary">Опубликовать</button></form>`)}
async function sell(e){e.preventDefault();try{await api('/api/cars',{method:'POST',body:JSON.stringify({make:$('#sMake').value,model:$('#sModel').value,year:Number($('#sYear').value),price:Number($('#sPrice').value),mileage:Number($('#sMileage').value||0),city:$('#sCity').value,fuel:$('#sFuel').value,transmission:$('#sTrans').value,image_url:$('#sImage').value,description:$('#sDesc').value})});closeModal();toast('Объявление опубликовано');loadCars()}catch(x){toast(x.message)}}
(async()=>{makes.forEach(m=>$('#make').insertAdjacentHTML('beforeend',`<option>${m}</option>`));try{me=(await api('/api/me')).user}catch{};$('#make').onchange=()=>{const map={"Mercedes-Benz":['E-Class','C-Class','S-Class','GLC','GLE'],BMW:['3 Series','5 Series','X5','X3'],Audi:['A4','A6','Q5','Q7'],Toyota:['Camry','RAV4','Land Cruiser']};$('#model').innerHTML='<option value="">Все модели</option>'+(map[$('#make').value]||[]).map(x=>`<option>${x}</option>`).join('')};loadCars()})();
</script></body></html>
